version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: vectra
      POSTGRES_PASSWORD: vectra
      POSTGRES_DB: vectra
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vectra"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: vectra
      MINIO_ROOT_PASSWORD: vectra123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://vectra:vectra@postgres:5432/vectra
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  signal-service:
    build:
      context: ..
      dockerfile: signal-service/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8100:8100"
    depends_on:
      redis:
        condition: service_healthy

  camera-ingestion-service:
    build:
      context: ..
      dockerfile: camera-ingestion-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://vectra:vectra@postgres:5432/vectra
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: local
      MINIO_ACCESS_KEY: vectra
      MINIO_SECRET_KEY: vectra123
      MINIO_BUCKET: vectra-frames
      MINIO_SECURE: "false"
      DETECTOR: yolo
    ports:
      - "8200:8200"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  police-case-service:
    build:
      context: ..
      dockerfile: police-case-service/Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://vectra:vectra@postgres:5432/vectra
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8300:8300"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  pgdata:
  minio-data: